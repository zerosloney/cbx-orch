name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 runner 已被 GitHub Actions 废弃，且其 --experimental-test-coverage
        # 在嵌套子目录（tui/components/）的报告渲染存在崩溃 bug。保留 22/24 两个 LTS。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - name: Test
        run: |
          set -o pipefail
          npm test | tee test-results.txt
      - name: Coverage
        run: |
          set -o pipefail
          npm run coverage | tee coverage.txt
      - run: npm run sbom
      - uses: actions/upload-artifact@v5
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            test-results.txt
            coverage.txt
            sbom.cdx.json
