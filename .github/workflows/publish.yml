name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > pack-manifest.json
          node -e "const pack = require('./pack-manifest.json')[0]; if (!pack.files.some(file => file.path === 'dist/src/cli.js')) throw new Error('npm package is missing dist/src/cli.js')"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
